# Corre os testes (vitest) e o build em cada push e pull request.
# A Vercel só faz o build; os testes da lógica (planos, Financinhas, mapa da
# criança…) passam a correr aqui. Não publica nada nem usa segredos.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
